<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You got mail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">
    <audio id="audioPlayer3">
        <source src="" type="audio">
    </audio>
    <h1>You got mail</h1>
    <img class="envelope" id="image" src="envelope.png">
</body>
<script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
<script>
    document.getElementById("image").addEventListener("click", () => {
        document.getElementById("body").innerHTML = `
            <img src="envelopeAnim.gif">
            <audio id="audioPlayer3" src="aotsong.mp3"></audio>`;
        setTimeout(() => {
            document.getElementById("body").innerHTML = `
                <div id="otsikko">
                    <img id="embelm" src="emblem.png">
                    <div id="textDiv">
                        <h1>Happy Birthday!</h1>
                        <p>最近、その「可愛さ」の術式が顕現した。術式の効果範囲に入った男は、例外なく彼女に心を奪われる</p>
                        <p>――ただ一人を除いてな。もちろん、五条悟だ。</p>
                        <p>この世界に生まれてきてくれてよかった, Anya</p>
                    </div>
                    <img id="embelm" src="emblem.png">
                </div>
                <img id="cat" src="bdAnim.gif">
                <audio id="audioPlayer3" src="aotsong.mp3"></audio>`;
            const jsConfetti = new JSConfetti();
            function Confetti() {
                jsConfetti.addConfetti();
            }
            setInterval(Confetti, 2000);
            let happyBdSong = document.getElementById("audioPlayer3");
            for(let x=0;x<2;x++){
                happyBdSong.play();
            }
            document.getElementById("cat").addEventListener("click", () => {
                let soundId = Math.floor(Math.random() * 2);
                let audioPlayer = document.getElementById(`audioPlayer${soundId + 1}`);
                if (audioPlayer) {
                    audioPlayer.play();
                    
                }
            });
        }, 1000);
    });
</script>
</html>
